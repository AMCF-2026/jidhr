[build]
builder = "nixpacks"

[deploy]
# --timeout 900, raised from 180 on 2026-10-09.
#
# 180 was below a real run: run_log 30, a 29-record registrations apply,
# took 318 seconds. It was not what killed that request — gunicorn kills a
# SILENT worker, and a gthread worker heartbeats from its own loop, which is
# why run_log 30 recorded a finished_at and status 'complete' rather than
# being cut off mid-write. The request was discarded by Railway's proxy,
# which closes a response after 5 minutes with no data transferred.
#
# It is raised anyway, because a registrations apply now runs in a
# BACKGROUND THREAD inside the worker. A worker killed mid-run is worse than
# a lost response: the writes stop half way, with no report and a run_log row
# stuck on 'running'. 900s matches Railway's own 15-minute ceiling, so the
# platform gives up before gunicorn does, in every case.
#
# --graceful-timeout 120 so a deploy lets an in-flight apply finish its
# current record instead of being cut at the default 30 seconds.
#
# ONE FILE, TWO SERVICES (V5.84). Every service built from this repo applies
# this file — on 2026-10-14 the new cron service did, despite Railway saying
# new services cannot opt into config-as-code — so the start command picks
# the role from JIDHR_ROLE:
#
#   JIDHR_ROLE=jobs   python scripts/jobs_run.py --once   (the cron service)
#   anything else     the gunicorn command, byte for byte as before (web)
#
# Wrapped in /bin/sh -c explicitly: Railway documents shell execution for
# Railpack but not for Nixpacks, and exec form does not expand variables. The
# wrapper works either way. `exec` hands the process over, so gunicorn or the
# runner receives Railway's signals directly, as gunicorn did before.
startCommand = "/bin/sh -c 'if [ \"$JIDHR_ROLE\" = \"jobs\" ]; then exec python scripts/jobs_run.py --once; else exec gunicorn app:app --bind 0.0.0.0:$PORT --workers 8 --threads 4 --timeout 900 --graceful-timeout 120; fi'"

# NO healthcheck in this file (V5.84). It applies to every service, and a
# deploy that does not answer 2xx on the path within the timeout is marked
# FAILED (docs.railway.com/reference/healthchecks). The runner serves no HTTP,
# so /health here would fail every cron deploy after 100 seconds. Web's
# healthcheck — /health, timeout 100, as before — is set in WEB's dashboard,
# which applies once this file stops setting it.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# =============================================================================
# SECOND SERVICE: the nightly jobs runner (cron)
# =============================================================================
# Same repo, same file, same image. Set on the cron service in its dashboard:
#
#   Variables       JIDHR_ROLE=jobs, plus the runner's own (see the V5.80 A4
#                   list: DATABASE_URL, CSuite, HubSpot, NOTIFY_*,
#                   SCHEDULED_SYNC_ENABLED)
#   Cron schedule   15 6 * * *   (06:15 UTC; not in this file, so the
#                                 dashboard value applies)
#   Healthcheck     none
#   Public domain   none
#
# app.py also refuses to start the web app when JIDHR_ROLE=jobs (V5.82), so a
# misconfigured cron service cannot serve web.
#
# Restart policy: this file's on_failure / 3 applies to the cron service too.
# A failed run (exit 1 or 2) is restarted up to 3 times; each restart runs
# --once again, which only claims jobs that are due — a failed job is either
# not retried (max_attempts 1) or retried later by the runner itself — so a
# restart costs a few seconds and changes nothing.

[build]
builder = "nixpacks"

[deploy]
# --timeout 900, raised from 180 on 2026-10-09.
#
# 180 was below a real run: run_log 30, a 29-record registrations apply,
# took 318 seconds. It was not what killed that request — gunicorn kills a
# SILENT worker, and a gthread worker heartbeats from its own loop, which is
# why run_log 30 recorded a finished_at and status 'complete' rather than
# being cut off mid-write. The request was discarded by Railway's proxy,
# which closes a response after 5 minutes with no data transferred.
#
# It is raised anyway, because a registrations apply now runs in a
# BACKGROUND THREAD inside the worker. A worker killed mid-run is worse than
# a lost response: the writes stop half way, with no report and a run_log row
# stuck on 'running'. 900s matches Railway's own 15-minute ceiling, so the
# platform gives up before gunicorn does, in every case.
#
# --graceful-timeout 120 so a deploy lets an in-flight apply finish its
# current record instead of being cut at the default 30 seconds.
startCommand = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 8 --threads 4 --timeout 900 --graceful-timeout 120"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# =============================================================================
# SECOND SERVICE: nightly jobs runner (cron)
# =============================================================================
# This file configures the web service above and is left as-is. The jobs
# runner is a SEPARATE Railway service on the SAME repo, created in the
# Railway dashboard rather than here, because Railway reads one railway.toml
# per service and the two need different start commands:
#
#   Service name    jidhr-jobs
#   Source          this repository, branch main (same as the web service)
#   Start command   /opt/venv/bin/python scripts/jobs_run.py --once
#                   (if that interpreter path is wrong on the image,
#                    `python scripts/jobs_run.py --once` — find the right
#                    one with `which gunicorn` in the web service's shell)
#   Cron schedule   15 6 * * *      (06:15 UTC = 2:15 AM ET; the queued
#                                    mirror_refresh is dated 06:00 UTC, so
#                                    it is already claimable when this fires)
#   Variables       share the web service's DATABASE_URL, CSUITE_API_KEY,
#                   CSUITE_API_SECRET, CSUITE_BASE_URL and SECRET_KEY
#                   (Railway: "Shared Variables" or reference ${{jidhr.X}})
#   Replicas        1 — two runners are safe (FOR UPDATE SKIP LOCKED), but
#                   one is enough and halves the CSuite call rate
#   Restart policy  never — `--once` exits 0 when the queue is empty, 1 if
#                   a job failed, 2 if the database is unreachable; a
#                   restart would just run an empty queue again
#
# After the service exists, seed the recurring job once from either
# service's shell:
#
#   /opt/venv/bin/python scripts/jobs_run.py --seed
#
# The runner re-queues the next 06:00 UTC occurrence itself after every
# run, so --seed is a one-time step (and is idempotent if run again).

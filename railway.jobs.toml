# =============================================================================
# Config-as-code for the jidhr-jobs Railway service ONLY.
# =============================================================================
#
# SET THIS ON jidhr-jobs: Settings -> Config-as-code -> Railway Config File
#   /railway.jobs.toml
# The path is absolute from the repo root, and Railway only accepts it from
# the dashboard — it cannot be declared inside a config file.
#
# WHY A SEPARATE FILE
# -------------------
# Every service deployed from this repo reads /railway.toml unless told
# otherwise, and "configuration defined in code will always override values
# from the dashboard" (docs.railway.com/reference/config-as-code). So without
# this path, jidhr-jobs would take the WEB service's startCommand — gunicorn —
# and that would override whatever start command was typed into the
# dashboard. It would boot a second copy of the web app instead of the
# runner.
#
# That is worse than merely wrong. A cron service must "execute a task, and
# terminate as soon as that task is finished", and "if a previous execution
# of your Cron service has a status of Active ... any new executions will not
# be run" (docs.railway.com/reference/cron-jobs). gunicorn never exits, so
# the first execution would stay Active forever and every later 06:15 would
# be SKIPPED — silently, which is the failure this whole runner exists to
# prevent.
#
# /railway.toml is the web service's and is untouched by this file. (Its
# trailing comments describe setting jidhr-jobs up through the dashboard
# start command; that guidance is superseded by this file, for the reason
# above.)
#
# WHAT IT RUNS
# ------------
# `--once` reaps stale in-flight jobs, keeps the recurring registrations_sync
# row alive, then claims and runs due jobs until none are claimable (capped
# at 1,000) and EXITS: 0 if all succeeded, 1 if any failed, 2 if the
# database is unreachable. It starts no server and no thread.
#
# Same nixpacks image as the web service. Bare `python` resolves to the
# image's venv: the web service's startCommand runs bare `gunicorn`, which
# lives in the same venv, and works.

[build]
builder = "nixpacks"

[deploy]
startCommand = "python scripts/jobs_run.py --once"

# 06:15 UTC daily — 2:15 AM Eastern in winter, 1:15 AM in summer. Railway
# cron is UTC. The recurring jobs are queued for 06:00 UTC, so both are
# already due when this fires; registrations_sync (priority 40) is claimed
# before the mirror (priority 50), so the daily email never waits on the
# mirror's ~25 minutes.
cronSchedule = "15 6 * * *"

# NEVER. A restart would just run --once again: an empty queue on success,
# and on failure the job is already failed and re-queued for tomorrow by
# the runner. A failed run is reported by the [Jidhr ALERT] email and by the
# non-zero exit, not by retrying.
restartPolicyType = "NEVER"

# No healthcheckPath, deliberately: the runner serves no HTTP, so any
# healthcheck would fail the deploy. Fields absent here fall back to the
# DASHBOARD, so leave jidhr-jobs' healthcheck field empty there too.
